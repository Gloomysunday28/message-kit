name: WebUI Hot Update

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build-webui.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webui-hot-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-webui.mjs
      - name: Publish rolling WebUI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view webui --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create webui --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "WebUI hot updates" \
              --notes "灵动岛界面热更新滚动通道"
          gh release upload webui dist-webui/webui.html --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload webui dist-webui/webui.json --repo "$GITHUB_REPOSITORY" --clobber
