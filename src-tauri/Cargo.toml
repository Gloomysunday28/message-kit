[package]
name = "lingdongdao"
version = "0.1.0"
description = "A Dynamic Island for the currently focused macOS app"
authors = ["weiguang"]
edition = "2021"

[lib]
name = "lingdongdao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
